# Abogen (Kokoro TTS) for scripts/abogen, run on the Mac. uv.lock pins the working set.
[project]
name = "servarr-tts"
version = "0"
requires-python = "==3.13.*"
dependencies = [
    "abogen>=1.3.1",
    "kokoro",
    "en-core-web-sm", # spaCy model abogen otherwise downloads at runtime, which uv sync then deletes
]

[tool.uv]
package = false

[tool.uv.sources]
kokoro = { git = "https://github.com/hexgrad/kokoro.git" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
